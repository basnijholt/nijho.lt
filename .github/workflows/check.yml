# Builds the site, checks every link in it, and runs tools/browser_check.py on it, for every pull request and every push
# to main. A push to main that passes is then deployed to the Cloudflare Pages project behind www.nijho.lt, and pull
# requests from this repository also get a Cloudflare Pages preview deployment.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer run for the same pull request or for main replaces the older one, so two deploys cannot finish out of order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: "0.167.0"
      WRANGLER_VERSION: "4.168.0"
    steps:
      - uses: actions/checkout@v7

      # The images are in Git LFS (about 200 MB); download them only when they change.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-files
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-files') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        run: git lfs pull

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium

      # Hugo's processed images. Their names and bytes depend only on the source image and the processing options, so
      # a cached copy builds the same site as Netlify's fresh one; --gc drops the images no page uses any more.
      - uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ env.HUGO_VERSION }}-${{ hashFiles('.lfs-files', 'layouts/**', 'config/**') }}
          restore-keys: hugo-resources-${{ env.HUGO_VERSION }}-

      - name: Build
        run: hugo --gc --minify -d public
        env:
          HUGO_ENV: production

      # Every link and #fragment within the site must resolve, absolute https://www.nijho.lt/ links included; links to
      # other sites are not fetched.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/public --index-files index.html
            --remap 'https://www\.nijho\.lt/ file://${{ github.workspace }}/public/'
            'public/**/*.html'

      - name: Check in Chromium
        run: uv run tools/browser_check.py public
        env:
          # Empty: use Playwright's Chromium instead of the NixOS default path.
          CHROMIUM: ""

      # The project takes uploads only, so this step is what publishes the site. The token needs one permission:
      # Account - Cloudflare Pages - Edit.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages deploy public --project-name nijholt --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Builds and publishes a Cloudflare Pages preview for pull requests from this repository (fork PRs have no secrets and
  # are skipped). Runs in parallel with `check` so a failing link or browser check does not block inspecting a preview,
  # and scopes pull-requests: write strictly to this job.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      HUGO_VERSION: "0.167.0"
      WRANGLER_VERSION: "4.168.0"
    steps:
      # Full history is required so Hugo's enableGitInfo computes real .Lastmod dates.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The images are in Git LFS (about 200 MB); download them only when they change.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-files
      - uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-files') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        run: git lfs pull

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Reuse the production image cache read-only so draft-only images do not pollute the shared cache key.
      - uses: actions/cache/restore@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ env.HUGO_VERSION }}-${{ hashFiles('.lfs-files', 'layouts/**', 'config/**') }}
          restore-keys: hugo-resources-${{ env.HUGO_VERSION }}-

      - name: Build preview
        run: >-
          hugo --gc --minify --buildFuture --buildDrafts
          --baseURL "https://pr-${PR_NUMBER}.nijholt.pages.dev/"
          -d public-preview
        env:
          HUGO_ENVIRONMENT: preview
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          deploy_log=$(mktemp)
          trap 'rm -f "$deploy_log"' EXIT
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy public-preview \
            --project-name nijholt \
            --branch "pr-${PR_NUMBER}" \
            --commit-dirty=true | tee "$deploy_log"
          alias_url="https://pr-${PR_NUMBER}.nijholt.pages.dev"
          deployment_url=$(grep -Eo 'https://[a-z0-9-]+\.nijholt\.pages\.dev' "$deploy_log" | grep -Fv "$alias_url" | tail -n 1 || true)
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment preview URL on pull request
        run: |
          marker='<!-- cloudflare-pages-preview -->'
          short_sha="${HEAD_SHA:0:7}"
          body=$(printf '%s\n**Cloudflare Pages preview:** %s' "$marker" "$ALIAS_URL")
          if [ -n "$DEPLOYMENT_URL" ]; then
            body=$(printf '%s\n\nCommit `%s`: %s' "$body" "$short_sha" "$DEPLOYMENT_URL")
          fi
          comment_id=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq 'add | map(select(.user.login == "github-actions[bot]" and (.body | contains("<!-- cloudflare-pages-preview -->")))) | .[0].id // ""')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
