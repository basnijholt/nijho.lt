# Builds the site with the Hugo version Netlify uses, checks every link in it, and runs tools/browser_check.py on it, for
# every pull request and every push to main. Netlify builds the deploy previews and production on its own.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: "0.167.0"
    steps:
      - uses: actions/checkout@v7

      # The images are in Git LFS (about 200 MB); download them only when they change.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-files
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-files') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        run: git lfs pull

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium

      # Hugo's processed images. Their names and bytes depend only on the source image and the processing options, so
      # a cached copy builds the same site as Netlify's fresh one; --gc drops the images no page uses any more.
      - uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ env.HUGO_VERSION }}-${{ hashFiles('.lfs-files', 'layouts/**', 'config/**') }}
          restore-keys: hugo-resources-${{ env.HUGO_VERSION }}-

      - name: Build
        run: hugo --gc --minify -d public
        env:
          HUGO_ENV: production

      # Every link and #fragment within the site must resolve, absolute https://www.nijho.lt/ links included; links to
      # other sites are not fetched.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/public --index-files index.html
            --remap 'https://www\.nijho\.lt/ file://${{ github.workspace }}/public/'
            'public/**/*.html'

      - name: Check in Chromium
        run: uv run tools/browser_check.py public
        env:
          # Empty: use Playwright's Chromium instead of the NixOS default path.
          CHROMIUM: ""
