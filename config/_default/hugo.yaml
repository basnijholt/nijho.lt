title: Bas Nijholt
baseurl: https://www.nijho.lt/
copyright: '© {year}'

cascade:
  # Blog post options
  - target:
      path: /post/**
    editable: true
    reading_time: true
    commentable: true

removePathAccents: true

summaryLength: 30
pagination:
  pagerSize: 100
enableEmoji: true
enableRobotsTXT: true
# Content .html files are SVG fragments that bleed-svg reads with readFile; as content, allowContent would refuse them
ignoreFiles: [\.html$]
permalinks:
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
disableAliases: true
outputs:
  home: [html, rss, json, webappmanifest, headers, redirects]
  section: [html, rss]
  taxonomy: [html, rss]
  term: [html, rss]
outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediaType: text/netlify
    notAlternative: true
  redirects:
    baseName: _redirects
    isPlainText: true
    mediaType: text/netlify
    notAlternative: true
mediaTypes:
  text/netlify:
    delimiter: ''
    suffixes: ['']
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 90
  webp:
    quality: 90
timeout: 600000
caches:
  # Remote resources (the GitHub star counts on the project cards) otherwise stay cached forever in Netlify's
  # persistent HUGO_CACHEDIR; refetch them after an hour.
  getresource:
    maxAge: 1h
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoIDType: github
      # A Markdown image alone in its paragraph renders as a figure, which a <p> may not contain
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
sitemap:
  changefreq: weekly
build:
  noJSConfigInAssets: true
