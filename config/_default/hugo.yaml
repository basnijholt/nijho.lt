# Configuration of Hugo
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: Bas Nijholt
baseurl: https://www.nijho.lt/
copyright: '© {year}'

############################
## PAGE OPTIONS
############################

cascade:
  # Blog post options
  - target:
      path: /post/**
    editable: true
    reading_time: true
    commentable: true
    show_related: true
    show_breadcrumb: true

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 100
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
# .html files in content are SVG fragments that the bleed-svg shortcode reads with readFile. Ignoring them keeps them
# from becoming content, so security.allowContent can keep its default, which refuses HTML content.
ignoreFiles: [\.html$, \.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  event: '/talk/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
disableAliases: true
outputs:
  home: [html, rss, json, webappmanifest, headers, redirects]
  section: [html, rss]
  taxonomy: [html, rss]
  term: [html, rss]
outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediaType: text/netlify
    notAlternative: true
  redirects:
    baseName: _redirects
    isPlainText: true
    mediaType: text/netlify
    notAlternative: true
mediaTypes:
  text/netlify:
    delimiter: ''
    suffixes: ['']
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 90
  webp:
    quality: 90
timeout: 600000
caches:
  # Remote resources (the GitHub star counts on the project cards) otherwise stay cached forever in Netlify's
  # persistent HUGO_CACHEDIR; refetch them after an hour.
  getresource:
    maxAge: 1h
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoIDType: github
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
sitemap:
  changefreq: weekly
build:
  noJSConfigInAssets: true
