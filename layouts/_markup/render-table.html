<div class="table-wrap">
<table
  {{- range $name, $value := .Attributes }}
    {{- if $value }}{{ printf " %s=%q" $name (string $value) | safeHTMLAttr }}{{ end }}
  {{- end }}>
<thead>
  {{- range .THead }}
<tr>
    {{- range . }}
<th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
    {{- end }}
</tr>
  {{- end }}
</thead>
  {{- with .TBody }}
<tbody>
    {{- range . }}
<tr>
      {{- range . }}
<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
</tr>
    {{- end }}
</tbody>
  {{- end }}
</table>
</div>
