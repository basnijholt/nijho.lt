[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.167.0"
  HUGO_ENABLEGITINFO = "true"
  # Native cache dir - no plugin needed
  HUGO_CACHEDIR = "/opt/build/cache/hugo"

[context.production.environment]
  HUGO_ENV = "production"

# The hugo command builds for the production environment unless told otherwise
[context.deploy-preview]
  command = 'hugo --gc --minify --buildFuture --buildDrafts --baseURL "$DEPLOY_PRIME_URL"'

[context.deploy-preview.environment]
  HUGO_ENVIRONMENT = "preview"

[context.branch-deploy]
  command = 'hugo --gc --minify --buildFuture --baseURL "$DEPLOY_PRIME_URL"'

[context.branch-deploy.environment]
  HUGO_ENVIRONMENT = "preview"
