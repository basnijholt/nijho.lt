<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZFS Unlock logo</title>
  <desc id="desc">A simple padlock that subtly opens and closes.</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102a43" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="body" x1="150" y1="218" x2="362" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.32" />
    </filter>
    <style>
      #static-shackle {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #animated-shackle,
        #keyhole-glow {
          display: none;
        }

        #static-shackle {
          display: inline;
        }
      }
    </style>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#background)" />
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#1e3a5f" stroke-width="4" />

  <g filter="url(#soft-shadow)">
    <g id="animated-shackle" fill="none" stroke-linecap="round">
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="5.8s"
        values="0 0; 0 0; 0 -34; 0 -34; 0 0; 0 0"
        keyTimes="0; 0.34; 0.48; 0.72; 0.86; 1"
        repeatCount="indefinite"
      />
      <path d="M178 252V184C178 130 212 96 256 96S334 130 334 184V228" stroke="#d5f9f3" stroke-width="34" />
      <path d="M178 252V184C178 130 212 96 256 96S334 130 334 184V228" stroke="#5eead4" stroke-width="12" />
    </g>
    <g id="static-shackle" fill="none" stroke-linecap="round">
      <path d="M178 238V184C178 130 212 96 256 96S334 130 334 184V238" stroke="#d5f9f3" stroke-width="34" />
      <path d="M178 238V184C178 130 212 96 256 96S334 130 334 184V238" stroke="#5eead4" stroke-width="12" />
    </g>

    <rect x="142" y="218" width="228" height="174" rx="42" fill="url(#body)" />
    <rect x="154" y="230" width="204" height="150" rx="32" fill="none" stroke="#ccfbf1" stroke-opacity="0.28" stroke-width="4" />

    <circle id="keyhole-glow" cx="256" cy="292" r="48" fill="#facc15" opacity="0">
      <animate
        attributeName="opacity"
        dur="5.8s"
        values="0; 0; 0.18; 0.18; 0; 0"
        keyTimes="0; 0.42; 0.54; 0.68; 0.8; 1"
        repeatCount="indefinite"
      />
    </circle>
    <circle cx="256" cy="284" r="24" fill="#07111f" />
    <path d="M256 304V346" stroke="#07111f" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
