<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Matrix MCP</title>
  <style>
    .current { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .spark { transform-box: fill-box; transform-origin: center; animation: breathe 6.4s ease-in-out infinite; }
      .glow { animation: glow 6.4s ease-in-out infinite; }
      .current { stroke-dasharray: 14 100; animation: current 6.4s ease-in-out infinite; }
      .current.late { animation-delay: .3s; }
    }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.07) rotate(4deg); } 55% { transform: scale(1); } }
    @keyframes glow { 0%, 100% { opacity: .55; } 30% { opacity: 1; } 60% { opacity: .5; } }
    @keyframes current {
      0%, 8% { opacity: 0; stroke-dashoffset: 14; }
      14% { opacity: .9; }
      34% { opacity: .9; stroke-dashoffset: -86; }
      40%, 100% { opacity: 0; stroke-dashoffset: -100; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143e69"/>
      <stop offset="1" stop-color="#081a2e"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f5ef"/>
      <stop offset="1" stop-color="#22b2c4"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd978" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#7fe8ee" stroke-opacity=".18" stroke-width="1.5"/>
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 30H31v58l-8 12h24" stroke="url(#bracket)"/>
    <path d="M81 30h16v60H81" stroke="url(#bracket)"/>
    <path class="current" d="M47 30H31v58l-8 12h24" pathLength="100" stroke="#fff4c7" stroke-width="4"/>
    <path class="current late" d="M81 30h16v60H81" pathLength="100" stroke="#fff4c7" stroke-width="4"/>
  </g>
  <circle class="glow" cx="64" cy="60" r="27" fill="url(#halo)"/>
  <path class="spark" d="M64 39c2.7 12 8.9 18.3 21 21-12.1 2.7-18.3 8.9-21 21-2.7-12.1-8.9-18.3-21-21 12.1-2.7 18.3-8.9 21-21z" fill="#ffd25e"/>
</svg>
