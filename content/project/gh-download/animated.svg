<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">gh-download logo</title>
  <desc id="desc">A GitHub contribution graph whose brightest squares form a download arrow, with a pulse of light flowing down the arrow.</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11161d" />
      <stop offset="1" stop-color="#0a0d12" />
    </linearGradient>
    <style>
      .arrow {
        animation: flow 3.2s ease-in-out infinite;
      }

      .bar {
        animation: land 3.2s ease-in-out infinite;
      }

      .twinkle {
        animation: twinkle 9s ease-in-out infinite;
      }

      @keyframes flow {
        0%, 30%, 100% { fill: #39d353; }
        12% { fill: #b4f5bd; }
      }

      @keyframes land {
        0%, 30%, 100% { fill: #26a641; }
        12% { fill: #39d353; }
      }

      @keyframes twinkle {
        0%, 100% { fill: #1c2128; }
        50% { fill: #0e4429; }
      }

      @media (prefers-reduced-motion: reduce) {
        rect {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#background)" />
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#30363d" stroke-width="4" />

  <g>
    <rect x="79" y="79" width="42" height="42" rx="9" fill="#006d32" />
    <rect x="131" y="79" width="42" height="42" rx="9" fill="#1c2128" class="twinkle" style="animation-duration: 7s; animation-delay: -1s" />
    <rect x="183" y="79" width="42" height="42" rx="9" fill="#0e4429" />
    <rect x="235" y="79" width="42" height="42" rx="9" fill="#39d353" class="arrow" style="animation-delay: 0.00s" />
    <rect x="287" y="79" width="42" height="42" rx="9" fill="#1c2128" />
    <rect x="339" y="79" width="42" height="42" rx="9" fill="#0e4429" />
    <rect x="391" y="79" width="42" height="42" rx="9" fill="#1c2128" />
    <rect x="79" y="131" width="42" height="42" rx="9" fill="#1c2128" />
    <rect x="131" y="131" width="42" height="42" rx="9" fill="#0e4429" />
    <rect x="183" y="131" width="42" height="42" rx="9" fill="#1c2128" />
    <rect x="235" y="131" width="42" height="42" rx="9" fill="#39d353" class="arrow" style="animation-delay: 0.14s" />
    <rect x="287" y="131" width="42" height="42" rx="9" fill="#0e4429" />
