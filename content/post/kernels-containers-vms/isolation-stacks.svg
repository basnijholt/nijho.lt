<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Three stacks side by side. Plain Docker: the agent's code makes syscalls straight into the host kernel, so the usual way out is a host kernel bug, reached through any syscall seccomp allows. gVisor: the agent's code makes syscalls into gVisor's own kernel, written in Go, which makes a small set of syscalls to the host kernel, so the usual way out is a gVisor bug and then a host kernel bug. Kata Containers: the agent's code runs on a guest kernel inside a microVM, and the CPU runs that guest kernel directly, next to the host kernel instead of on top of it. When the guest needs a device, a VM exit hands control to the KVM module in the host kernel, which passes the request up to the VMM, a normal program on the host that fakes the device. The VMM and KVM together are the hypervisor, so the usual way out is a guest kernel bug and then a hypervisor bug.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="526" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- column headers -->
  <g text-anchor="middle">
    <text x="97" y="34" font-size="17" font-weight="700" fill="#1e3a8a">Plain Docker</text>
    <text x="97" y="56" font-size="14" fill="#64748b">runc, the default</text>
    <text x="272" y="34" font-size="17" font-weight="700" fill="#4c1d95">gVisor</text>
    <text x="272" y="56" font-size="14" fill="#64748b">runsc</text>
    <text x="517" y="34" font-size="17" font-weight="700" fill="#14532d">Kata Containers</text>
    <text x="517" y="56" font-size="14" fill="#64748b">one microVM per container</text>
  </g>

  <!-- host kernel, drawn first so everything else sits on top -->
  <rect x="20" y="308" width="640" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="197" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Host Linux kernel</text>

  <!-- hardware -->
  <rect x="20" y="406" width="640" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="197" y="427" text-anchor="middle" font-size="15" fill="#334155">CPU and hardware</text>

  <g stroke-width="2" stroke-dasharray="6 4">
    <!-- Plain Docker -->
    <rect x="30" y="76" width="135" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="30" y="320" width="135" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>

    <!-- gVisor -->
    <rect x="205" y="76" width="135" height="36" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="205" y="148" width="135" height="54" rx="8" fill="#ede9fe" stroke="#dc2626"/>
    <rect x="232" y="320" width="80" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>

    <!-- Kata: the microVM reaches down to the CPU, past the host kernel -->
    <rect x="375" y="70" width="150" height="336" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="387" y="98" width="126" height="34" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1" stroke-dasharray="none"/>
    <rect x="387" y="160" width="126" height="38" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="550" y="98" width="110" height="52" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="550" y="320" width="110" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="97" y1="114" x2="97" y2="313"/>
    <line x1="272" y1="114" x2="272" y2="141"/>
    <line x1="272" y1="204" x2="272" y2="313"/>
    <line x1="450" y1="134" x2="450" y2="153"/>
    <line x1="397" y1="200" x2="397" y2="399"/>
    <path d="M513,180 H580 V313"/>
    <line x1="635" y1="318" x2="635" y2="157"/>
  </g>
  <g font-size="14" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="107" y="222">syscalls</text>
    <text x="282" y="136">syscalls</text>
    <text x="282" y="264">syscalls</text>
    <text x="458" y="151" font-size="13">syscalls</text>
    <text x="531" y="172">VM exits</text>
  </g>

  <g text-anchor="middle" fill="#1e293b">
    <text x="97" y="99" font-size="15">Agent's code</text>
    <text x="97" y="337" font-size="14">every syscall</text>
    <text x="97" y="355" font-size="14">seccomp allows</text>

    <text x="272" y="99" font-size="15">Agent's code</text>
    <text x="272" y="171" font-size="15" font-weight="600">gVisor kernel</text>
    <text x="272" y="192" font-size="14" fill="#475569">written in Go</text>
    <text x="272" y="337" font-size="14">a small set of</text>
    <text x="272" y="355" font-size="14">syscalls</text>

    <text x="450" y="120" font-size="15">Agent's code</text>
    <text x="450" y="184" font-size="15">Guest kernel</text>
    <text x="605" y="120" font-size="15" font-weight="600">VMM</text>
    <text x="605" y="140" font-size="14" fill="#475569">fake devices</text>
    <text x="605" y="346" font-size="15" font-weight="600">KVM</text>
  </g>
  <text x="387" y="89" font-size="14" font-weight="600" fill="#166534">microVM</text>
  <g font-size="14" font-weight="600" fill="#166534">
    <text x="407" y="366">runs directly</text>
    <text x="407" y="384">on the CPU</text>
  </g>

  <!-- hypervisor bracket -->
  <path d="M668,98 h8 v264 h-8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text transform="translate(700,230) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">hypervisor</text>

  <!-- the usual way out, per column -->
  <text x="340" y="466" text-anchor="middle" font-size="14" fill="#64748b">Red dashed: code the agent can attack on its way to the host</text>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">
    <text x="97" y="492">host kernel</text>
    <text x="272" y="492">gVisor, then</text>
    <text x="272" y="512">host kernel</text>
    <text x="517" y="492">guest kernel, then</text>
    <text x="517" y="512">hypervisor</text>
  </g>
</svg>
