<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Three stacks side by side. Plain Docker: the agent's code talks to the host kernel directly. gVisor: the agent's code talks to the Sentry, a kernel written in Go, which makes a few filtered calls to the host kernel. Kata: the agent's code runs on a guest kernel inside a microVM, run by a VMM such as QEMU, Firecracker or Cloud Hypervisor, on top of the KVM module in the host kernel. The VMM plus KVM together are the hypervisor. All three run on a CPU with virtualization support.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="638" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- column headers -->
  <g text-anchor="middle">
    <text x="125" y="40" font-size="16" font-weight="700" fill="#1e3a8a">Plain Docker (runc)</text>
    <text x="125" y="60" font-size="12.5" fill="#64748b">Docker's default</text>
    <text x="335" y="40" font-size="16" font-weight="700" fill="#4c1d95">gVisor (runsc)</text>
    <text x="335" y="60" font-size="12.5" fill="#64748b">a kernel in user space</text>
    <text x="620" y="40" font-size="16" font-weight="700" fill="#14532d">Kata Containers</text>
    <text x="620" y="60" font-size="12.5" fill="#64748b">starts one microVM per container</text>
    <text x="620" y="76" font-size="11.5" fill="#94a3b8">(Proxmox and AWS Lambda manage VMs in the same spot)</text>
  </g>

  <!-- arrows first -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="125" y1="150" x2="125" y2="308"/>
    <line x1="335" y1="207" x2="335" y2="308"/>
  </g>
  <g font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="133" y="245">syscalls</text>
    <text x="343" y="250">few, filtered</text>
    <text x="343" y="266">host syscalls</text>
  </g>

  <!-- runc column -->
  <rect x="40" y="114" width="170" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="136" text-anchor="middle" font-size="14" fill="#1e293b">Agent's code</text>

  <!-- gVisor column -->
  <rect x="250" y="114" width="170" height="34" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="335" y="136" text-anchor="middle" font-size="14" fill="#1e293b">Agent's code</text>
  <rect x="250" y="158" width="170" height="48" rx="8" fill="#ede9fe" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="335" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Sentry</text>
  <text x="335" y="196" text-anchor="middle" font-size="12" fill="#475569">gVisor's kernel, in Go</text>

  <!-- Kata column: VMM process containing the microVM -->
  <rect x="450" y="88" width="340" height="208" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="462" y="96" width="316" height="104" rx="10" fill="#dcfce7" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="474" y="110" font-size="11.5" fill="#166534">microVM (CPU in guest mode)</text>
  <rect x="480" y="116" width="280" height="32" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="620" y="137" text-anchor="middle" font-size="14" fill="#1e293b">Agent's code</text>
  <rect x="480" y="156" width="280" height="34" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="620" y="178" text-anchor="middle" font-size="14" fill="#1e293b">Guest Linux kernel</text>

  <text x="620" y="226" text-anchor="middle" font-size="12.5" fill="#166534">VMM, pick one: sets up the VM and fakes its devices</text>
  <rect x="464" y="238" width="98" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="513" y="266" text-anchor="middle" font-size="13.5" fill="#1e293b">QEMU</text>
  <rect x="571" y="238" width="98" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="620" y="266" text-anchor="middle" font-size="13.5" fill="#1e293b">Firecracker</text>
  <rect x="678" y="238" width="98" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="727" y="258" text-anchor="middle" font-size="13" fill="#1e293b">Cloud</text>
  <text x="727" y="274" text-anchor="middle" font-size="13" fill="#1e293b">Hypervisor</text>

  <!-- host kernel -->
  <rect x="30" y="310" width="770" height="84" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="332" font-size="15" font-weight="700" fill="#78350f">Host Linux kernel</text>
  <rect x="40" y="340" width="170" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="125" y="358" text-anchor="middle" font-size="12" fill="#1e293b">every syscall the</text>
  <text x="125" y="374" text-anchor="middle" font-size="12" fill="#1e293b">seccomp filter allows</text>
  <rect x="464" y="320" width="312" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="620" y="343" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">KVM module</text>
  <text x="620" y="362" text-anchor="middle" font-size="12" fill="#475569">kvm.ko + kvm_intel / kvm_amd</text>
  <text x="620" y="377" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/dev/kvm</text>

  <!-- hypervisor bracket -->
  <path d="M800,238 h10 v146 h-10" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text transform="translate(838,311) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">hypervisor</text>
  <text transform="translate(858,311) rotate(-90)" text-anchor="middle" font-size="12" fill="#0f766e">= VMM + KVM</text>

  <!-- hardware -->
  <rect x="30" y="406" width="770" height="54" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="415" y="428" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">CPU and hardware</text>
  <text x="415" y="448" text-anchor="middle" font-size="12" fill="#475569">virtualization support: VT-x / AMD-V guest mode, EPT page tables, IOMMU</text>

  <!-- what the agent has to break -->
  <text x="30" y="490" font-size="12.5" font-weight="700" fill="#dc2626">What the agent has to break (red dashed)</text>
  <g font-size="12.5" fill="#7f1d1d" text-anchor="middle">
    <text x="125" y="514">the host kernel,</text>
    <text x="125" y="531">through any allowed</text>
    <text x="125" y="548">syscall</text>
    <text x="335" y="514">the Sentry first, then</text>
    <text x="335" y="531">the host kernel through</text>
    <text x="335" y="548">a small filtered set</text>
    <text x="620" y="514">the CPU's guest mode, KVM,</text>
    <text x="620" y="531">and a few fake devices</text>
  </g>

  <line x1="30" y1="568" x2="800" y2="568" stroke="#e2e8f0"/>
  <g font-size="12" fill="#64748b">
    <text x="30" y="592">QEMU without KVM also works, but then it emulates the whole CPU in software, which is very slow.</text>
    <text x="30" y="612">With passthrough (VFIO + IOMMU), a real device goes straight to the guest and skips the fake one.</text>
  </g>
</svg>
