<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Three stacks side by side. Plain Docker: the agent's code makes syscalls straight into the host kernel, so the agent has to break the host kernel through any syscall seccomp allows. gVisor: the agent's code makes syscalls into the Sentry, a kernel written in Go, which makes a few syscalls to the host kernel, so the agent has to break the Sentry and then the host kernel. Kata Containers: the agent's code runs on a guest Linux kernel inside a microVM. VM exits go to the KVM module in the host kernel, which passes device requests up to the VMM. The VMM and KVM together are the hypervisor, so the agent has to break the guest kernel and then the hypervisor.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="526" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- column headers -->
  <g text-anchor="middle">
    <text x="105" y="34" font-size="17" font-weight="700" fill="#1e3a8a">Plain Docker</text>
    <text x="105" y="56" font-size="14" fill="#64748b">runc, the default</text>
    <text x="295" y="34" font-size="17" font-weight="700" fill="#4c1d95">gVisor</text>
    <text x="295" y="56" font-size="14" fill="#64748b">runsc</text>
    <text x="530" y="34" font-size="17" font-weight="700" fill="#14532d">Kata Containers</text>
    <text x="530" y="56" font-size="14" fill="#64748b">one microVM per container</text>
  </g>

  <!-- host kernel, drawn first so everything else sits on top -->
  <rect x="20" y="308" width="640" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Host Linux kernel</text>

  <g stroke-width="2" stroke-dasharray="6 4">
    <!-- Plain Docker -->
    <rect x="35" y="76" width="140" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="30" y="320" width="150" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>

    <!-- gVisor -->
    <rect x="225" y="76" width="140" height="36" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="225" y="148" width="140" height="54" rx="8" fill="#ede9fe" stroke="#dc2626"/>
    <rect x="255" y="320" width="80" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>

    <!-- Kata -->
    <rect x="400" y="70" width="260" height="142" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="none"/>
    <rect x="420" y="98" width="220" height="34" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1" stroke-dasharray="none"/>
    <rect x="420" y="160" width="220" height="38" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="550" y="228" width="110" height="52" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="550" y="320" width="110" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="105" y1="114" x2="105" y2="313"/>
    <line x1="295" y1="114" x2="295" y2="141"/>
    <line x1="295" y1="204" x2="295" y2="313"/>
    <line x1="530" y1="134" x2="530" y2="153"/>
    <path d="M460,214 V341 H543"/>
    <line x1="605" y1="318" x2="605" y2="289"/>
  </g>
  <g font-size="14" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="115" y="222">syscalls</text>
    <text x="305" y="136">syscalls</text>
    <text x="305" y="264">syscalls</text>
    <text x="540" y="151">syscalls</text>
    <text x="470" y="270">VM exits</text>
  </g>

  <g text-anchor="middle" fill="#1e293b">
    <text x="105" y="99" font-size="15">Agent's code</text>
    <text x="105" y="337" font-size="14">every syscall</text>
    <text x="105" y="355" font-size="14">seccomp allows</text>

    <text x="295" y="99" font-size="15">Agent's code</text>
    <text x="295" y="171" font-size="15" font-weight="600">Sentry</text>
    <text x="295" y="192" font-size="14" fill="#475569">a kernel in Go</text>
    <text x="295" y="337" font-size="14">a few</text>
    <text x="295" y="355" font-size="14">syscalls</text>

    <text x="530" y="120" font-size="15">Agent's code</text>
    <text x="530" y="184" font-size="15">Guest Linux kernel</text>
    <text x="605" y="250" font-size="15" font-weight="600">VMM</text>
    <text x="605" y="270" font-size="14" fill="#475569">fake devices</text>
    <text x="605" y="346" font-size="15" font-weight="600">KVM</text>
  </g>
  <text x="414" y="89" font-size="14" font-weight="600" fill="#166534">microVM</text>

  <!-- hypervisor bracket -->
  <path d="M668,228 h8 v134 h-8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text transform="translate(700,295) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">hypervisor</text>

  <!-- hardware -->
  <rect x="20" y="406" width="640" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="340" y="427" text-anchor="middle" font-size="15" fill="#334155">Hardware</text>

  <!-- what the agent has to break, per column -->
  <text x="340" y="466" text-anchor="middle" font-size="14" fill="#64748b">Red dashed: what the agent has to break to reach the host</text>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">
    <text x="105" y="492">host kernel</text>
    <text x="295" y="492">Sentry, then</text>
    <text x="295" y="512">host kernel</text>
    <text x="530" y="492">guest kernel, then</text>
    <text x="530" y="512">hypervisor</text>
  </g>
</svg>
