<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Containers are processes that all make syscalls into one shared Linux kernel, which enforces namespaces, cgroups and seccomp">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="538" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="430" y="38" text-anchor="middle" font-size="15" fill="#475569">What each one sees from the inside</text>

  <!-- Container A -->
  <rect x="40" y="56" width="240" height="150" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">Container A</text>
  <g font-size="13.5" fill="#1e293b">
    <text x="62" y="114">PID 1 is python</text>
    <text x="62" y="138">/ is its own image</text>
    <text x="62" y="162">eth0 is its own network</text>
    <text x="62" y="186">root, but only in here</text>
  </g>

  <!-- Container B -->
  <rect x="310" y="56" width="240" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Container B</text>
  <g font-size="13.5" fill="#1e293b">
    <text x="332" y="114">PID 1 is chromium</text>
    <text x="332" y="138">/ is a different image</text>
    <text x="332" y="162">eth0 is another network</text>
    <text x="332" y="186">root, but only in here</text>
  </g>

  <!-- Host -->
  <rect x="580" y="56" width="240" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Host processes</text>
  <g font-size="13.5" fill="#1e293b">
    <text x="602" y="114">sshd, dockerd, mindroom</text>
    <text x="602" y="138">the real /</text>
    <text x="602" y="162">the real network</text>
    <text x="602" y="186">the real root</text>
  </g>

  <!-- syscall arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="208" x2="160" y2="290"/>
    <line x1="430" y1="208" x2="430" y2="290"/>
    <line x1="700" y1="208" x2="700" y2="290"/>
  </g>
  <g font-size="13" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="170" y="254">read, open, clone</text>
    <text x="440" y="254">socket, mmap, write</text>
    <text x="710" y="254">same syscalls</text>
  </g>

  <!-- Kernel -->
  <rect x="40" y="296" width="780" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">One shared Linux kernel</text>

  <g>
    <rect x="62" y="342" width="236" height="78" rx="10" fill="#ffffff" stroke="#fbbf24"/>
    <text x="180" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Namespaces</text>
    <text x="180" y="388" text-anchor="middle" font-size="13" fill="#334155">what a process can see</text>
    <text x="180" y="408" text-anchor="middle" font-size="12" fill="#64748b">pid, mnt, net, user, uts, ipc</text>

    <rect x="312" y="342" width="236" height="78" rx="10" fill="#ffffff" stroke="#fbbf24"/>
    <text x="430" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">cgroups</text>
    <text x="430" y="388" text-anchor="middle" font-size="13" fill="#334155">how much it can use</text>
    <text x="430" y="408" text-anchor="middle" font-size="12" fill="#64748b">CPU, memory, number of processes</text>

    <rect x="562" y="342" width="236" height="78" rx="10" fill="#ffffff" stroke="#fbbf24"/>
    <text x="680" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">seccomp</text>
    <text x="680" y="388" text-anchor="middle" font-size="13" fill="#334155">which syscalls it may make</text>
    <text x="680" y="408" text-anchor="middle" font-size="12" fill="#64748b">a filter in front of the kernel</text>
  </g>

  <text x="430" y="448" text-anchor="middle" font-size="13.5" fill="#78350f">The kernel enforces the isolation and is also what gets attacked.</text>
  <text x="430" y="466" text-anchor="middle" font-size="13.5" font-weight="600" fill="#b91c1c">One bug here reaches every container and the host.</text>

  <!-- Hardware -->
  <rect x="40" y="490" width="780" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="430" y="511" text-anchor="middle" font-size="14" fill="#334155">Hardware</text>
</svg>
