<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452" width="660" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Two containers and the host's own processes all make syscalls into one shared Linux kernel, which keeps the containers apart with namespaces, cgroups and seccomp. One bug in that kernel reaches every container and the host.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="658" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Container A -->
  <rect x="20" y="16" width="200" height="136" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">Container A</text>
  <g font-size="15" fill="#1e293b">
    <text x="36" y="72">PID 1 is python</text>
    <text x="36" y="94">its own files</text>
    <text x="36" y="116">its own network</text>
    <text x="36" y="138">limited root</text>
  </g>

  <!-- Container B -->
  <rect x="230" y="16" width="200" height="136" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="330" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Container B</text>
  <g font-size="15" fill="#1e293b">
    <text x="246" y="72">PID 1 is chromium</text>
    <text x="246" y="94">its own files</text>
    <text x="246" y="116">its own network</text>
    <text x="246" y="138">limited root</text>
  </g>

  <!-- Host -->
  <rect x="440" y="16" width="200" height="136" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="540" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Host processes</text>
  <g font-size="15" fill="#1e293b">
    <text x="456" y="72">sshd, dockerd, …</text>
    <text x="456" y="94">the real files</text>
    <text x="456" y="116">the real network</text>
    <text x="456" y="138">the real root</text>
  </g>

  <!-- syscall arrows, all ending on the same kernel -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="154" x2="120" y2="215"/>
    <line x1="330" y1="154" x2="330" y2="215"/>
    <line x1="540" y1="154" x2="540" y2="215"/>
  </g>
  <g font-size="14" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="130" y="192">syscalls</text>
    <text x="340" y="192">syscalls</text>
    <text x="550" y="192">syscalls</text>
  </g>

  <!-- Kernel -->
  <rect x="20" y="222" width="620" height="174" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">One shared Linux kernel</text>

  <rect x="130" y="266" width="400" height="92" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <g font-size="15">
    <text x="154" y="292" font-weight="600" fill="#1e293b">Namespaces</text>
    <text x="274" y="292" fill="#334155">what a process can see</text>
    <text x="154" y="316" font-weight="600" fill="#1e293b">cgroups</text>
    <text x="274" y="316" fill="#334155">how much it can use</text>
    <text x="154" y="340" font-weight="600" fill="#1e293b">seccomp</text>
    <text x="274" y="340" fill="#334155">which syscalls it may make</text>
  </g>

  <text x="330" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">One bug here reaches every container and the host.</text>

  <!-- Hardware -->
  <rect x="20" y="408" width="620" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="330" y="429" text-anchor="middle" font-size="15" fill="#334155">Hardware</text>
</svg>
