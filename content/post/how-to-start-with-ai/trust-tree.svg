<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <title>How closely to look: core nodes get scrutiny, leaf nodes do not</title>
  <g stroke="#9aa3b2" stroke-width="2" fill="none">
    <path d="M480 50 L370 140 M480 50 L590 140"/>
    <path d="M370 140 L300 240 M370 140 L370 240 M370 140 L440 240"/>
    <path d="M590 140 L520 240 M590 140 L590 240 M590 140 L660 240"/>
  </g>
  <g fill="#4269d0" stroke="#2c4a9e" stroke-width="3">
    <circle cx="480" cy="50" r="26"/>
    <circle cx="370" cy="140" r="20"/>
    <circle cx="590" cy="140" r="20"/>
  </g>
  <g fill="#c9ced8" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 4">
    <circle cx="300" cy="240" r="15"/>
    <circle cx="370" cy="240" r="15"/>
    <circle cx="440" cy="240" r="15"/>
    <circle cx="520" cy="240" r="15"/>
    <circle cx="590" cy="240" r="15"/>
    <circle cx="660" cy="240" r="15"/>
  </g>
  <g font-size="16" fill="#4269d0" font-weight="600">
    <text x="10" y="80">The core</text>
  </g>
  <g font-size="14" fill="#4269d0">
    <text x="10" y="102">Everything depends on it.</text>
    <text x="10" y="121">Read it, understand it.</text>
  </g>
  <g font-size="16" fill="#8a93a3" font-weight="600">
    <text x="10" y="222">The leaves</text>
  </g>
  <g font-size="14" fill="#8a93a3">
    <text x="10" y="244">Nothing depends on them.</text>
    <text x="10" y="263">Check that they work.</text>
  </g>
</svg>
