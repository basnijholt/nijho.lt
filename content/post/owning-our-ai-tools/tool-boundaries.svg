<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="Three ways to shape AI tool definitions: one function per endpoint causes schema bloat; one giant mega-tool breaks read-only and approval boundaries; risk-scoped read and write action pairs keep schemas compact while preserving clear permission boundaries.">
  <rect x="0" y="0" width="920" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Three ways to shape AI tools for one service</text>
  <text x="460" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">Compact schemas matter, but permissions and approvals live at the function boundary</text>

  <!-- Column 1: 1 function per endpoint -->
  <rect x="24" y="76" width="276" height="292" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="76" width="276" height="40" rx="10" fill="#fee2e2"/>
  <rect x="24" y="106" width="276" height="10" fill="#fee2e2"/>
  <text x="162" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">1. One function per endpoint</text>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#1e293b">
    <rect x="42" y="132" width="240" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="54" y="149">list_issues()</text>
    <rect x="42" y="164" width="240" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="54" y="181">get_issue()</text>
    <rect x="42" y="196" width="240" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="54" y="213">search_issues()</text>
    <rect x="42" y="228" width="240" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="54" y="245">create_issue()</text>
    <rect x="42" y="260" width="240" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="54" y="277">close_issue()  ...34 more</text>
  </g>

  <text x="42" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Problem: schema bloat</text>
  <text x="42" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Up to 39 functions for one service.</text>
  <text x="42" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Resent on every single turn.</text>

  <!-- Column 2: 1 mega-tool -->
  <rect x="322" y="76" width="276" height="292" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="322" y="76" width="276" height="40" rx="10" fill="#fef3c7"/>
  <rect x="322" y="106" width="276" height="10" fill="#fef3c7"/>
  <text x="460" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400e">2. One giant mega-tool</text>

  <rect x="340" y="132" width="240" height="154" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="354" y="155" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#1e293b">service_tool(action=...)</text>
  <text x="354" y="178" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#475569">reads:  list | get | search</text>
  <text x="354" y="198" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#9a3412">writes: create | delete | send</text>
  <rect x="354" y="216" width="212" height="54" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="460" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Reads and writes mixed</text>
  <text x="460" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">No clean read-only switch</text>

  <text x="340" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">Problem: blurry permissions</text>
  <text x="340" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Read-only agents still see write args.</text>
  <text x="340" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Approvals need custom argument parsing.</text>

  <!-- Column 3: Risk-scoped action= pairs -->
  <rect x="620" y="76" width="276" height="292" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="620" y="76" width="276" height="40" rx="10" fill="#dcfce7"/>
  <rect x="620" y="106" width="276" height="10" fill="#dcfce7"/>
  <text x="758" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#166534">3. Read and write action pairs</text>

  <!-- Read box -->
  <rect x="638" y="132" width="240" height="60" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="650" y="154" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#1e3a8a">service_read(action=...)</text>
  <text x="650" y="174" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1e40af">list | get | search</text>

  <!-- Red dashed safety boundary -->
  <line x1="636" y1="208" x2="880" y2="208" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="688" y="198" width="140" height="20" rx="4" fill="#ffffff"/>
  <text x="758" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">SAFETY BOUNDARY</text>

  <!-- Write box -->
  <rect x="638" y="226" width="240" height="60" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="248" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#78350f">service_write(action=...)</text>
  <text x="650" y="268" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#92400e">create | update | delete</text>

  <text x="638" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#166534">Sweet spot: compact and safe</text>
  <text x="638" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">50% fewer schema tokens across catalog.</text>
  <text x="638" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Drop *_write for read-only, or gate writes.</text>

  <!-- Legend -->
  <rect x="24" y="384" width="872" height="30" rx="6" fill="#f1f5f9"/>
  <rect x="44" y="394" width="14" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="64" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Read-only function</text>
  <rect x="210" y="394" width="14" height="10" rx="2" fill="#fef3c7" stroke="#d97706"/>
  <text x="230" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Mutating function (can require approval)</text>
  <line x1="500" y1="399" x2="532" y2="399" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Function-level permission and approval boundary</text>
</svg>
