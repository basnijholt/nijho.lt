[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parity"
version = "0.1.0"
description = "Compare Hugo builds of nijho.lt before and after a theme change"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "lxml",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
parity = "parity.__main__:main"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: builds the real baseline commit with Hugo 0.123.3 (skipped when that binary is unavailable)",
]
